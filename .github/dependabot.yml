# Dependabot configuration — https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/lxc_autoscale"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Requirements are declared as ranges on purpose: an install always gets
    # the newest compatible release. Only touch a range when a new version
    # falls outside it, instead of raising the lower bound every week.
    # pip does not accept "widen"; this is the equivalent it does accept.
    versioning-strategy: increase-if-necessary
    groups:
      pip:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/lxc_autoscale"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
